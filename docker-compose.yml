services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecclesiaos-central-support:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ecclesia_support}
      DB_USERNAME: ${DB_USERNAME:-ecclesia}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      UPDATE_AGENT_URL: http://updater:8080
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:?Set UPDATE_AGENT_TOKEN in .env}
      UPDATE_REF: ${UPDATE_REF:-main}
    ports:
      - "${APP_PORT:-8090}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) (file_get_contents('http://127.0.0.1/up') === false));\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: ecclesiaos-central-support:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ecclesia_support}
      DB_USERNAME: ${DB_USERNAME:-ecclesia}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CACHE_STORE: file
      QUEUE_CONNECTION: database
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    depends_on:
      db:
        condition: service_healthy

  updater:
    build:
      context: .
      dockerfile: docker/updater/Dockerfile
    restart: unless-stopped
    environment:
      UPDATE_AGENT_TOKEN: ${UPDATE_AGENT_TOKEN:?Set UPDATE_AGENT_TOKEN in .env}
      UPDATE_REF: ${UPDATE_REF:-main}
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - app_storage:/shared
    expose:
      - "8080"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ecclesia_support}
      MYSQL_USER: ${DB_USERNAME:-ecclesia}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  app_storage:
  db_data:
